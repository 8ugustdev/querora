[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/core",
    "crates/mcp",
    "crates/pro",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/8ugustdev/querora"
authors = ["Querora Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
build-override.opt-level = 0
